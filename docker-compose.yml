# Apache Airflow 2.10 (LocalExecutor + Postgres metadata DB) running the digital-twin DAG,
# plus the Streamlit control tower reading the same DuckDB warehouse.
#
#   docker compose up airflow-init        # once: migrate metadata DB + create admin user
#   docker compose up -d
#   Airflow UI  → http://localhost:8080  (admin / admin – local only)
#   Dashboard   → http://localhost:8501
x-airflow: &airflow
  image: apache/airflow:2.10.3-python3.12
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
    SCT_DATA_DIR: /opt/airflow/project/data
    _PIP_ADDITIONAL_REQUIREMENTS: "duckdb>=1.1 networkx>=3.2 scikit-learn>=1.4 scipy>=1.11 pyarrow>=14"
  volumes:
    - .:/opt/airflow/project
  depends_on:
    postgres: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: airflow, POSTGRES_PASSWORD: airflow, POSTGRES_DB: airflow }
    healthcheck: { test: ["CMD", "pg_isready", "-U", "airflow"], interval: 5s, retries: 20 }
    volumes: [airflow-db:/var/lib/postgresql/data]

  airflow-init:
    <<: *airflow
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname a --lastname b
             --role Admin --email admin@example.com && airflow pools set warehouse_write 1 'DuckDB single writer'"

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    restart: unless-stopped

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports: ["8080:8080"]
    restart: unless-stopped

  dashboard:
    image: python:3.12-slim
    working_dir: /app
    volumes: [.:/app]
    command: sh -c "pip install --no-cache-dir -r requirements.txt && streamlit run dashboard/app.py --server.address 0.0.0.0"
    ports: ["8501:8501"]

volumes:
  airflow-db:
